[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfd-twin"
version = "0.1.0"
description = "Traceable 23-cell immersion-cooling CFD case generator"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
media = ["Pillow>=10"]
cad = ["cadquery>=2.5"]
results = ["numpy>=2.0", "matplotlib>=3.9", "vtk>=9.3"]

[project.scripts]
cfd-twin = "cfd_twin.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
