name: Windows and Linux portability
on: [push, pull_request]
permissions:
  contents: read
env:
  PYTHONUTF8: "1"
jobs:
  portable-workflow:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[cad,results,media]"
      - name: Workflow and cross-platform regression tests
        run: python -m unittest tests.test_bootstrap tests.test_file_lock tests.test_launch_workflow tests.test_experiments tests.test_viewer_release tests.test_workflow_app tests.test_workflow_cancel tests.test_cad_import_workflow tests.test_wall_diagnostic_workflow tests.test_production_mesh -q
      - name: Fresh-checkout startup
        run: python -m cfd_twin.bootstrap --check
      - name: CLI imports on Windows and Linux
        run: python tools/run_wall_diagnostic_batch.py --help
