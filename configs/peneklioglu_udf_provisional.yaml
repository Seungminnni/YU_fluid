# 사용자가 제공한 2024 학위논문 식 (4.1)을 명시적으로 선택하는 overlay다.
# 최종 수치해석에 사용된 4차 UDF 원본은 PDF에 없으므로 이 파일은
# provisional이며, 최종 UDF와 동일하다고 주장할 수 없다.
battery:
  initial_temperature: "293.15 K"
  heat_source:
    mode: peneklioglu_expanded_first_order
    correlation: expanded_first_order_q_gt_0p5
    initial_soc: 1.0
    reference_temperature: "293.15 K"
    outside_policy: error

# 논문 상관식의 기준온도와 새 계산의 열적 기준점을 일치시킨다. 기존
# baseline의 293 K 완료 결과를 바꾸는 것이 아니라 이 overlay에만 적용된다.
boundary:
  inlet_temperature: "293.15 K"
  initial_fluid_temperature: "293.15 K"
  initial_solid_temperature: "293.15 K"
