schema_version: 1
name: phi19_mesh_independence_800_1000k_smooth_v9_20261007

# Uses only the content-addressed, hash-verified shared Ø19 STEP inputs that
# sit outside all failed job folders.  New mesh and solution job directories
# are created empty with new UUIDs; no old mesh or field is reused.
inputs:
  coolant: deionized_water
  inlet_temperature_k: 293.0
  inlet_velocity_m_s: 0.4
  outlet_pressure_pa: 101325.0

overlays:
  - ../recalculation_600k_phi19_vertical_flip_20260922.yaml

cases:
  - name: phi19_mesh_800k_smooth_v9
    cold_flow_maximum_iterations: 20000
    inputs:
      mesh_target_cells: 800000
    mesh_profiles:
      - production_phi19_mesh_study_800k_smooth_v2

  - name: phi19_mesh_1000k_smooth_v9
    cold_flow_maximum_iterations: 20000
    inputs:
      mesh_target_cells: 1000000
    mesh_profiles:
      - production_phi19_mesh_study_1000k_smooth_v2
