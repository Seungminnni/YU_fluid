# Fresh Ø32/Ø33 calculations using the unchanged physical and mesh conditions
# that passed the existing Ø28 and Ø31 calculations.
schema_version: 1
name: frame_fit_water_phi32_phi33_20261002
inputs:
  coolant: deionized_water
  inlet_temperature_k: 293.0
  inlet_velocity_m_s: 0.4
  outlet_pressure_pa: 101325.0
  mesh_target_cells: 600000
mesh_profiles:
  - production_frame_fit_8um_10layers_ab_B
cases:
  - name: phi32
    overlays: [../frame_fit_water_phi32_20261002.yaml]
  - name: phi33
    overlays: [../frame_fit_water_phi33_20261002.yaml]
