# Fresh Ø32/Ø33/Ø34 calculations under one frozen physical-condition set.
# The global solver acceptance gate is 1e-3.  The 6 µm / 11-layer motion
# profile previously passed Ø34's wall/y+ and quality gates at about 662k
# cells, inside the user-approved 600k--690k envelope.
schema_version: 1
name: frame_fit_water_phi32_phi33_phi34_residual_1e3_20261002
inputs:
  coolant: deionized_water
  inlet_temperature_k: 293.0
  inlet_velocity_m_s: 0.4
  outlet_pressure_pa: 101325.0
  mesh_target_cells: 600000
mesh_profiles:
  - production_frame_fit_6um_11layers_motion
cases:
  - name: phi32
    overlays: [../frame_fit_water_phi32_20261002.yaml]
  - name: phi33
    overlays: [../frame_fit_water_phi33_20261002.yaml]
  - name: phi34
    overlays: [../frame_fit_water_phi34_20260929.yaml]
