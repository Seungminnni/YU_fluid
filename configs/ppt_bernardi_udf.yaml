# ``UDF 설명_20260910 (2).pptx``의 2C·293.15 K 발열식을 선택한다.
# Ri(SOC): Peneklioglu 학위논문 Figure 4.2, Group 7
# ΔS(SOC): Peneklioglu 학위논문 Figure 4.6, 293.15 K
# qcell = I^2 Ri - I T ΔS/F, I=2 Ah*2C=4 A
battery:
  initial_temperature: "293.15 K"
  heat_source:
    mode: peneklioglu_bernardi_2c_293p15
    correlation: bernardi_ri_entropy_component_fits
    initial_soc: 1.0
    reference_temperature: "293.15 K"
    outside_policy: error
  electrical_metadata:
    capacity: "2 Ah"
    discharge_rate_c: 2.0

# Fluent 비교조건: 냉각수는 293 K, 배터리는 293.15 K에서 시작한다.
# 발열 상관식의 기준온도 293.15 K는 USE_LOCAL_CELL_T=0 의미와 동일하며,
# 유체 초기·입구 온도와는 별개의 입력이다.
boundary:
  inlet_temperature: "293 K"
  initial_fluid_temperature: "293 K"
  initial_solid_temperature: "293.15 K"
